[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backyard-worlds"
version = "0.1.0"
description = "Automated brown dwarf / moving-object candidate ranking for Backyard Worlds WISE flipbooks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "BSD-3-Clause"}
authors = [{name = "David Ackerman", email = "ackermand@hhmi.org"}]
keywords = ["astronomy", "wise", "brown-dwarfs", "zooniverse", "backyard-worlds", "temporal-detection", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.26.0,<2.4",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.33",
    "pyarrow>=14.0.0",
    "faiss-cpu>=1.7.4",
    "termcolor>=2.0.0",       # required by DINOv3 torch.hub code
    "panoptes-client>=1.6.0", # Zooniverse Panoptes API
    "astropy>=6.0",
    "tensorboard>=2.15.0",
]

[project.urls]
Repository = "https://github.com/davidackerman/backyard_worlds"
Issues = "https://github.com/davidackerman/backyard_worlds/issues"

[project.scripts]
backyard-worlds-pipeline = "backyard_worlds.scripts:run_pipeline"

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
black = ">=24.0.0"
ruff = ">=0.2.0"
mypy = ">=1.8.0"
pre-commit = ">=3.6.0"

[tool.pixi.environments]
default = {features = ["dev"], solve-group = "default"}
prod = {solve-group = "default"}

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "N", "W", "B"]
lint.ignore = ["E203", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pixi.dependencies]
python = "3.12.*"
pytorch = {version = ">=2.0.0", channel = "pytorch", build = "*cuda*"}
torchvision = {version = ">=0.15.0", channel = "pytorch"}
numpy = ">=1.26.0,<2.4"
opencv = ">=4.12.0,<5"
transformers = ">=4.56.0,<5.0"
huggingface_hub = ">=0.34.0,<1.0"
pyarrow = ">=22.0.0,<23"
imageio = ">=2.34.0,<3"

[tool.pixi.pypi-dependencies]
backyard-worlds = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ scripts/ tests/"
format = "black src/ scripts/ tests/"
typecheck = "mypy src/"
backyard-worlds = "backyard-worlds-pipeline --config configs/pipelines/backyard_worlds.yaml"
download-subjects = "python scripts/download_backyard_worlds.py"
train-temporal-detector = "python scripts/train_temporal_detector.py"
train-crop-classifier = "python scripts/train_crop_classifier.py"

[tool.hatch.build.targets.wheel]
packages = ["src/backyard_worlds"]
